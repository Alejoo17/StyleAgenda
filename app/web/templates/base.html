<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StyleAgenda{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
{% if user is defined %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container">
  <a class="navbar-brand fw-bold" href="/">StyleAgenda</a>
  <span class="navbar-text me-3">{{ user.name }} · {{ user.role.value }}</span>
  <form method="post" action="/auth/logout"><button class="btn btn-outline-light btn-sm">Salir</button></form>
</div></nav>
{% endif %}
<main class="container py-4">{% block content %}{% endblock %}</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body></html>
